; Gamepads come through Microsoft GameInput (the GameInputWindows plugin), which recognises Xbox controllers and
; others such as the DualSense as gamepads and picks them up when they are connected. XInputDevice is disabled in
; the .uproject so an Xbox controller is not read twice. GameInput leaves gamepads off by default on desktop
; platforms (UGameInputPlatformSettings::InitializePlatformDefaults), so they are turned on here.
[GameInputPlatformSettings_Windows GameInputPlatformSettings]
bProcessGamepad=True
